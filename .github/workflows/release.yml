name: Build and Release APK

on:
  push:
    branches: [claude/new-session-WRKZ0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=8.6

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Garage Remote v2.0.0
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## Garage Remote v2.0.0

            An Android remote control for garages that open via phone call.

            ### How to install
            Download `app-release.apk` and tap to install.
            Enable **Settings → Apps → Special app access → Install unknown apps** for your browser if prompted.

            **Updates install directly** — no need to uninstall first.

            ### How to use
            - Tap **+** to add a garage (name + phone number)
            - Tap **Open** — the app calls the number and auto-hangs up after ~12 seconds (2 rings)
            - Long-press the app icon to use Quick Settings shortcuts
            - Use the ⋮ menu to export/import your garage list as a JSON file
            - Grant **Location** permission to see garages sorted nearest-first with distance shown on each card
            - Add a GPS location to any garage via the edit dialog — tap "Map" to pick visually on OpenStreetMap, or "Use GPS" to use your current position
